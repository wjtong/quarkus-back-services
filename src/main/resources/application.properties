# PostgreSQL Datasource - 连接到现有的 OFBiz 数据库
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=ofbiz
quarkus.datasource.password=ofbiz
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ofbiz

# 当应用启动时，根据实体类自动更新数据库表结构
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# SmallRye JWT - JWT 配置
mp.jwt.verify.issuer=crm-service
# mp.jwt.verify.audiences=crm-api

# JWT 签名配置 - 使用 RS256 算法
smallrye.jwt.sign.key.location=privateKey-pkcs8.pem
smallrye.jwt.sign.algorithm=RS256

# JWT 验证配置 - 使用公钥
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem

# JWT 自定义配置
jwt.issuer=crm-service
jwt.expiration.time=3600

# OpenAPI 配置
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# 日志配置
quarkus.log.level=INFO
quarkus.log.category."com.example.crm".level=DEBUG

# 应用配置
quarkus.application.name=CRM Service
quarkus.application.version=1.0.0

# HTTP 配置
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# LangChain4j AI 配置
langchain4j.openai.api-key=${OPENAI_API_KEY:your-openai-api-key}
langchain4j.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
langchain4j.openai.model=${OPENAI_MODEL:gpt-3.5-turbo}
langchain4j.openai.temperature=${OPENAI_TEMPERATURE:0.7}
langchain4j.openai.max-tokens=${OPENAI_MAX_TOKENS:1000}

# 向量数据库配置 (可选)
langchain4j.embedding.store.type=${EMBEDDING_STORE_TYPE:in-memory}
langchain4j.embedding.store.dimension=${EMBEDDING_DIMENSION:1536}

# AI Agent 配置
ai.agent.enabled=${AI_AGENT_ENABLED:true}
ai.agent.max-conversation-history=${AI_AGENT_MAX_HISTORY:10}
ai.agent.timeout=${AI_AGENT_TIMEOUT:30}
